[project]
name = "plinth"
version = "0.1.0"
description = "On-demand site intelligence reports for real estate professionals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # CLI
    "click>=8.1",

    # API server (Phase 8+)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",

    # Database
    "psycopg[binary]>=3.1",

    # Configuration
    "pydantic-settings>=2.5",

    # Orchestration
    "prefect>=3.0",

    # Object storage
    "boto3>=1.34",

    # Geospatial
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",

    # HTTP client (API-based sources)
    "httpx>=0.27",

    # Report generation
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "matplotlib>=3.8",
]

[project.scripts]
plinth-cli = "plinth.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plinth"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
