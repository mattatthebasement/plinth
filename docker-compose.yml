services:
  postgres:
    image: imresamu/postgis:15-3.4-alpine
    platform: linux/arm64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plinth}
      POSTGRES_USER: ${POSTGRES_USER:-plinth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - plinth-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plinth} -d ${POSTGRES_DB:-plinth}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - /data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - plinth-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  prefect-server:
    image: prefecthq/prefect:3-latest
    platform: linux/arm64
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_ENABLED: "true"
      PREFECT_UI_API_URL: http://${SERVER_IP}:4200/api
    ports:
      - "4200:4200"
    networks:
      - plinth-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  prefect-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - staging-data:/staging
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - plinth-net
    restart: on-failure

  # api service — placeholder for a later phase
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.api
  #   env_file:
  #     - .env
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - plinth-net

volumes:
  postgres-data:
  staging-data:

networks:
  plinth-net:
    driver: bridge
